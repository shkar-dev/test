name: Build Unsigned iOS App

on:
  push:
    branches: [ main, master ] # Triggers whenever you push to main/master
  workflow_dispatch: # Allows you to trigger the build manually on GitHub

jobs:
  build:
    runs-on: macos-latest # This assigns GitHub's cloud Mac to build your app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned Debug)
        run: |
          # The --no-codesign flag skips Apple's certificate check completely
          flutter build ios --debug --no-codesign 

      - name: Zip into Payload format
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r app.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-ipa
          path: build/ios/iphoneos/app.ipa
